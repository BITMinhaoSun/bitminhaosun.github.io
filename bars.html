<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beijing Bar Notes | Minhao Sun</title>
  <meta name="description" content="Minhao Sun's personal ratings and notes on bars in Beijing.">
  <meta name="theme-color" content="#f8f7f3">
  <link rel="canonical" href="https://bitminhaosun.github.io/bars.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="bars.css?v=cf7999c030b6">
  <script src="bars.js?v=18123b16654a" defer></script>
</head>
<body>
  <a class="skip-link" href="#reviews">Skip to reviews</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="index.html" aria-label="Minhao Sun, home">MS<span aria-hidden="true">.</span></a>
      <nav aria-label="Navigation"><a href="index.html">Back to homepage</a></nav>
    </div>
  </header>
  <main class="bar-page" id="main">
    <section class="bar-intro" aria-labelledby="page-title">
      <div class="bar-intro-copy">
        <p class="eyebrow">Minhao Sun / After hours</p>
        <h1 id="page-title">Beijing <em>Bar Notes</em><span aria-hidden="true">.</span></h1>
        <p class="bar-subtitle">Notes on the drinks, the atmosphere, and the experience of each visit.</p>
      </div>
      <figure class="cover-photo">
        <img src="assets/bars/xiang.jpg" width="1280" height="1707" alt="The stage at Xiang Live House under colored lights">
        <figcaption lang="zh-CN">响live house</figcaption>
      </figure>
    </section>
    <section class="bar-reviews" id="reviews" aria-labelledby="reviews-title">
      <div class="feed-toolbar">
        <h2 id="reviews-title">Reviews <span id="review-count"></span></h2>
        <label class="review-sort" hidden>Sort by
          <select id="review-sort"><option value="">Listed order</option><option value="atmosphere">Atmosphere score</option><option value="quality">Drink quality score</option><option value="environment">Environment score</option><option value="price">Price score</option></select>
        </label>
      </div>
      <div id="reviews-list"></div>
      <noscript><p>Enable JavaScript to view the reviews.</p></noscript>
    </section>
    <footer><span>© 2026 Minhao Sun</span><a href="index.html">Back to homepage</a></footer>
  </main>
  <dialog id="review-viewer" aria-label="Review photo">
    <button type="button" class="viewer-close">Close <span aria-hidden="true">×</span></button>
    <figure><img alt=""><figcaption></figcaption></figure>
  </dialog>
</body>
</html>
